name: Feature request
description: Suggest a capability or documentation improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This project prioritizes security and predictable lifecycle behavior over feature count.
        Proposals that add a network listener, weaken SSH restrictions, or publish a port will be declined unless there is a compelling, documented threat model.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This request does not require exposing a new network port by default.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation
        - Updates and rollback
        - Backup and restore
        - Documentation
        - Home Assistant add-on
        - Security hardening
        - Developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: New files written, permissions, listeners, SSH changes, or secret handling.
    validations:
      required: true
