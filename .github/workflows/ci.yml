name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Shell, Node, and repository tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install static analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck openssh-client

      - name: Make scripts executable
        run: |
          chmod +x server-installer/*.sh server-installer/bin/cliproxy-manager
          chmod +x tests/*.sh tests/unit/*.sh tests/integration/*.sh
          chmod +x haos-addon/rootfs/run.sh

      - name: ShellCheck (errors block, warnings reported)
        run: |
          mapfile -t files < <(find . -path ./.git -prune -o -name '*.sh' -print; echo ./server-installer/bin/cliproxy-manager)
          shellcheck --version
          shellcheck -S error "${files[@]}"
          shellcheck -S warning -f gcc "${files[@]}" || true

      - name: JavaScript syntax
        run: |
          while IFS= read -r file; do node --check "$file"; done < <(
            find tests haos-addon -type f \( -name '*.js' -o -name '*.mjs' \)
          )

      - name: Run test suite
        run: bash tests/run_all.sh

  ssh-e2e:
    name: Real OpenSSH forwarding restrictions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install OpenSSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server curl

      - name: Create isolated sshd fixtures
        run: |
          set -euo pipefail
          FIX="$RUNNER_TEMP/sshd"
          mkdir -p "$FIX"
          sudo mkdir -p /run/sshd
          ssh-keygen -q -t ed25519 -N '' -f "$FIX/client_key"
          ssh-keygen -q -t ed25519 -N '' -f "$FIX/host_key"
          : > "$FIX/authorized_keys"
          cat > "$FIX/sshd_sudo" <<'EOF'
          #!/bin/sh
          exec sudo -n /usr/sbin/sshd "$@"
          EOF
          chmod +x "$FIX/sshd_sudo"

      - name: Run real sshd E2E
        env:
          SSHD_BIN: ${{ runner.temp }}/sshd/sshd_sudo
          SSHD_CLIENT_KEY: ${{ runner.temp }}/sshd/client_key
          SSHD_HOST_KEY: ${{ runner.temp }}/sshd/host_key
          SSHD_USER: runner
          SSHD_PORT: "2222"
        run: |
          chmod +x tests/test_ssh_hardening.sh
          bash tests/test_ssh_hardening.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
